name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Use a dummy remote URL to force Next.js to treat the DB as dynamic
          # and skip pre-rendering attempts during the CI build
          TURSO_DATABASE_URL: "libsql://dummy.turso.io"
          TURSO_AUTH_TOKEN: "dummy-token"
